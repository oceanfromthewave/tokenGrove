appId: com.tokengrove.app
productName: Token Grove
directories:
  output: dist
files:
  - out/**
  - package.json
icon: build/icon.png
win:
  target:
    - target: nsis
      arch: x64
nsis:
  oneClick: false # 설치 경로를 사용자가 고를 수 있게 한다
  allowToChangeInstallationDirectory: true
  runAfterFinish: false
  artifactName: TokenGrove-Setup-${version}.${ext}
publish:
  provider: github # 자동 업데이트가 latest.yml을 찾는 곳 (릴리스 업로드는 직접 한다)
  owner: oceanfromthewave
  repo: tokenGrove
